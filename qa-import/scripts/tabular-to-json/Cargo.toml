[package]
name = "tabular-to-json"
version = "0.1.0"
edition = "2021"
description = "Deterministic QA spreadsheet to JSON importer"
license = "MIT"

[dependencies]
calamine = { version = "0.26.1", features = ["dates"] }
chrono = "0.4.45"
clap = { version = "4.6.0", features = ["derive"] }
csv = "1.4.0"
quick-xml = "0.31.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
url = "2.5.8"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
rust_xlsxwriter = "=0.95.0"
